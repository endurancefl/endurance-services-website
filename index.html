<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endurance Services</title>
    <link rel="icon" type="image/png" href="images/iceberg-icon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Inter:wght@500&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
        }
        canvas {
            position: fixed;
            z-index: 1;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        canvas.over-logo { cursor: pointer; }
        .address {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.35em;
            padding: 0 24px;
            text-align: center;
            color: #274637;
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
        }
        .address.show {
            opacity: 1;
            transform: none;
            transition: opacity 0.9s ease 0.35s, transform 0.9s ease 0.35s;
        }
        .address .street {
            font-family: "Oswald", "Arial Narrow", sans-serif;
            font-weight: 500;
            font-size: 16px; /* set by the script to fit inside the iceberg */
            letter-spacing: 0.04em;
            text-transform: uppercase;
            line-height: 1.25;
            white-space: nowrap;
        }
        .address .by-appt {
            font-family: "Inter", system-ui, sans-serif;
            font-weight: 500;
            font-size: 9px; /* set by the script */
            letter-spacing: 0.18em;
            text-transform: uppercase;
            opacity: 0.75;
        }
        noscript img {
            position: fixed;
            inset: 0;
            margin: auto;
            width: min(60vw, 60vh, 480px);
        }
    </style>
</head>
<body>
    <div class="address" id="address" aria-hidden="true">
        <div class="street"><span class="line">2586 N Orange Blossom Trail</span><br><span class="line">Orlando, FL 32804</span></div>
        <div class="by-appt"><span class="line">By Appointment Only</span></div>
    </div>
    <canvas id="berg" role="img" aria-label="Endurance Services" tabindex="0"></canvas>
    <noscript><img src="images/iceberg-icon.png" alt="Endurance Services"></noscript>
    <script>
    (() => {
        const GREEN = '#274637';
        // The iceberg traced from images/iceberg-icon.png, in its own 900 x 900 space.
        const LOGO = new Path2D('M733,399 691,320 633,294 604,344 602,344 613,276 511,120 380,255 265,274 166,400Z M512,137 492,291 414,344 533,331 576,376 582,385 218,384 273,284 376,267 363,335 405,247 494,153Z M65,419 65,437 165,437 196,465 262,483 269,456 272,453 272,502 294,651 375,687 416,786 505,704 506,541 527,609 607,555 652,459 658,510 684,525 735,437 834,437 834,419Z M437,447 380,524 380,582 359,525 387,451 390,447Z');
        const canvas = document.getElementById('berg');
        const ctx = canvas.getContext('2d');
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Cut the logo into small square chips (logo units).
        const CELL = 20;
        const chips = [];
        for (let y = 110; y < 800; y += CELL) {
            for (let x = 60; x < 840; x += CELL) {
                // Any ink at all makes a chip, so together the chips are the whole logo, down to the thinnest edge.
                let ink = 0;
                for (let a = 0; a <= 10; a++) for (let b = 0; b <= 10; b++) {
                    if (ctx.isPointInPath(LOGO, x + a * 2, y + b * 2, 'evenodd')) ink++;
                }
                if (ink > 0) chips.push({ hx: x, hy: y, x: 0, y: 0, vx: 0, vy: 0, a: 0, va: 0 });
            }
        }

        // Screen layout: the logo sits centered at min(60vw, 60vh, 480px), as before.
        let W = 0, H = 0, scale = 1, ox = 0, oy = 0, R = 5;
        function layout() {
            const dpr = window.devicePixelRatio || 1;
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            const size = Math.min(W * 0.6, H * 0.6, 480);
            scale = size / 900; ox = (W - size) / 2; oy = (H - size) / 2;
            R = CELL * scale * 0.5;
            fitAddress(size);
        }

        // The address sits behind the iceberg and must fit inside its outline, so it is covered when the iceberg is whole.
        const address = document.getElementById('address');
        const street = address.querySelector('.street'), byAppt = address.querySelector('.by-appt');
        function fitAddress(size) {
            let px = Math.min(18, size * 0.045);
            street.style.fontSize = px + 'px';
            const room = 700 * (size / 900);
            const wide = street.scrollWidth;
            if (wide > room) { px *= room / wide; street.style.fontSize = px + 'px'; }
            byAppt.style.fontSize = Math.max(7, px * 0.5) + 'px';
        }
        const homeX = c => ox + (c.hx + CELL / 2) * scale;
        const homeY = c => oy + (c.hy + CELL / 2) * scale;

        let mode = 'whole';           // whole | fallen | reform
        const SPREAD = 900;           // ms from the tip's row leaving to the bottom row leaving
        const TOP = Math.min(...chips.map(c => c.hy)), BOTTOM = Math.max(...chips.map(c => c.hy));
        let reformEnd = 0, fadeFrom = 1;
        const ADDRESS_FADE = 900;     // ms for the address to fade away once the pieces start flying back
        const gx = 0, gy = 1;
        let quiet = 0, running = false, reformT0 = 0;

        // The address is one solid block once it shows: pieces bounce off it and pile up on top.
        const lineEls = [...document.querySelectorAll('#address .line')];
        let solids = [];
        function readSolids() {
            if (!address.classList.contains('show')) { solids = []; return; }
            const boxes = lineEls.map(el => el.getBoundingClientRect());
            const trim = boxes[0].height * 0.14;
            solids = [{ l: Math.min(...boxes.map(b => b.left)), r: Math.max(...boxes.map(b => b.right)),
                        t: boxes[0].top + trim, b: boxes[boxes.length - 1].bottom - trim * 0.5 }];
        }
        function overAddress(x, y) {
            readSolids();
            return solids.some(s => x >= s.l - 12 && x <= s.r + 12 && y >= s.t - 12 && y <= s.b + 12);
        }
        const G = 0.45;               // gravity, px per frame squared at 60fps

        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = GREEN;
            if (mode === 'whole') {
                ctx.save(); ctx.translate(ox, oy); ctx.scale(scale, scale);
                ctx.fill(LOGO, 'evenodd'); ctx.restore();
                return;
            }
            if (mode === 'reform') {
                // Landed chips become one piece of the real logo, so there are no seams between them.
                const landed = new Path2D();
                for (const c of chips) if (c.k >= 1) landed.rect(c.hx, c.hy, CELL, CELL);
                ctx.save(); ctx.translate(ox, oy); ctx.scale(scale, scale);
                ctx.clip(landed); ctx.fill(LOGO, 'evenodd');
                ctx.restore();
            }
            for (const c of chips) {
                if (mode === 'reform' && c.k >= 1) continue;
                ctx.save();
                ctx.translate(c.x, c.y); ctx.rotate(c.a); ctx.scale(scale, scale);
                ctx.translate(-c.hx - CELL / 2, -c.hy - CELL / 2);
                ctx.beginPath(); ctx.rect(c.hx - 1.5, c.hy - 1.5, CELL + 3, CELL + 3); ctx.clip();
                ctx.fill(LOGO, 'evenodd');
                ctx.restore();
            }
        }

        function step() {
            let fastest = 0;
            for (const c of chips) {
                c.vx += gx * G; c.vy += gy * G;
                c.vx *= 0.985; c.vy *= 0.985;
                const prevY = c.y;
                c.x += c.vx; c.y += c.vy; c.a += c.va; c.va *= 0.97;
                if (c.y > H - R) { c.y = H - R; c.vy *= -0.25; c.vx *= 0.9; c.va *= 0.8; }
                if (c.x < R) { c.x = R; c.vx *= -0.3; }
                if (c.x > W - R) { c.x = W - R; c.vx *= -0.3; }
                // The address is a ledge: pieces fly up through it, and land on top of it coming down.
                // Only pieces a blast has thrown land there, so the first reveal stays clean.
                if (c.blasted && c.vy >= 0) {
                    for (const s of solids) {
                        const top = s.t - R;
                        if (c.x >= s.l && c.x <= s.r && prevY <= top + 0.5 && c.y >= top) {
                            c.y = top; c.vy *= -0.2; c.vx *= 0.85; c.va *= 0.7;
                        }
                    }
                }
            }
            // Chips push each other apart; neighbours found through a coarse grid.
            const size = R * 2.4, grid = new Map(), key = (i, j) => i * 100000 + j;
            chips.forEach((c, n) => {
                const k = key(Math.floor(c.x / size), Math.floor(c.y / size));
                if (!grid.has(k)) grid.set(k, []);
                grid.get(k).push(n);
            });
            const min = R * 1.8;
            for (let pass = 0; pass < 2; pass++) {
                chips.forEach((c, n) => {
                    const ci = Math.floor(c.x / size), cj = Math.floor(c.y / size);
                    for (let i = ci - 1; i <= ci + 1; i++) for (let j = cj - 1; j <= cj + 1; j++) {
                        const cell = grid.get(key(i, j));
                        if (!cell) continue;
                        for (const m of cell) {
                            if (m <= n) continue;
                            const o = chips[m], dx = o.x - c.x, dy = o.y - c.y, d2 = dx * dx + dy * dy;
                            if (d2 > 0 && d2 < min * min) {
                                const d = Math.sqrt(d2), push = (min - d) / 2, ux = dx / d, uy = dy / d;
                                c.x -= ux * push; c.y -= uy * push; o.x += ux * push; o.y += uy * push;
                                const rv = (o.vx - c.vx) * ux + (o.vy - c.vy) * uy;
                                if (rv < 0) { c.vx += ux * rv * 0.5; c.vy += uy * rv * 0.5; o.vx -= ux * rv * 0.5; o.vy -= uy * rv * 0.5; }
                            }
                        }
                    }
                });
            }
            for (const c of chips) fastest = Math.max(fastest, Math.abs(c.vx), Math.abs(c.vy));
            return fastest;
        }

        let last = 0;
        function tick(now) {
            if (mode === 'fallen') {
                // Same speed on 60Hz and 120Hz screens.
                const steps = last ? Math.max(1, Math.min(3, Math.round((now - last) / 16.7))) : 1;
                let fastest = 0;
                readSolids();
                for (let s = 0; s < steps; s++) fastest = step();
                quiet = fastest < 0.08 ? quiet + 1 : 0;
            }
            last = now;
            if (mode === 'reform') {
                // Every chip in a row leaves together, top row first, so the iceberg builds from the tip down.
                // Each chip has its own slightly different timing, so they arrive as a swarm, not in rows.
                const t = now - reformT0;
                for (const c of chips) {
                    c.k = Math.max(0, Math.min(1, (t - c.delay) / c.fly));
                    const e = 1 - Math.pow(1 - c.k, 3);
                    c.x = c.sx + (homeX(c) - c.sx) * e;
                    c.y = c.sy + (homeY(c) - c.sy) * e;
                    c.a = c.sa * (1 - e);
                }
                const fade = Math.max(0, 1 - t / ADDRESS_FADE);
                address.style.opacity = (fadeFrom * fade * fade).toFixed(3);
                if (t >= reformEnd) {
                    mode = 'whole';
                    address.classList.remove('show');
                    address.style.transition = ''; address.style.opacity = '';
                    address.setAttribute('aria-hidden', 'true');
                }
            }
            draw();
            // Rest when the pile has settled; a blast or resize wakes it.
            if (mode === 'whole' || (mode === 'fallen' && quiet > 90)) { running = false; last = 0; return; }
            requestAnimationFrame(tick);
        }
        function wake() {
            quiet = 0;
            if (!running) { running = true; requestAnimationFrame(tick); }
        }

        function showAddress() {
            address.classList.add('show');
            address.setAttribute('aria-hidden', 'false');
        }

        function crumble(tx, ty) {
            // Pieces burst up and away from where the iceberg was tapped; the closest ones fly hardest.
            mode = 'fallen';
            showAddress();
            const k = H / 900, reach = 900 * scale * 0.35;
            for (const c of chips) {
                c.x = homeX(c); c.y = homeY(c); c.a = 0; c.blasted = false;
                const dx = c.x - tx, dy = c.y - ty, d = Math.hypot(dx, dy) || 1;
                const near = Math.exp(-d / reach);
                // Each piece gets its own speed and a slightly different angle, so they spray apart.
                const spread = (Math.random() - 0.5) * 0.9, kick = 0.5 + Math.random();
                const ux = Math.cos(spread) * dx / d - Math.sin(spread) * dy / d;
                const uy = Math.sin(spread) * dx / d + Math.cos(spread) * dy / d;
                c.vx = ux * (3 + 11 * near) * k * kick;
                c.vy = (uy * (2 + 6 * near) - (4 + 8 * near) * kick - Math.random() * 3) * k;
                c.va = (Math.random() - 0.5) * (0.15 + 0.4 * near);
            }
            wake();
        }
        // A tap on the pile: a little explosion that throws the nearby pieces up and away.
        function blast(x, y) {
            const reach = Math.max(70, Math.min(W, H) * 0.25), k = H / 900;
            for (const c of chips) {
                const dx = c.x - x, dy = c.y - y, d = Math.hypot(dx, dy) || 1;
                if (d > reach) continue;
                const f = 1 - d / reach, kick = 0.7 + Math.random() * 0.6;
                c.blasted = true;
                c.vx += (dx / d) * (2 + 6 * f) * k * kick;
                // strong enough to throw pieces from the floor up past the address, never far off the top
                c.vy += ((dy / d) * (2 + 6 * f)) * k - (4 + 24 * Math.pow(f, 0.7)) * kick * Math.sqrt(k);
                c.vy = Math.max(c.vy, -Math.sqrt(2 * G * H * 0.92));
                c.va += (Math.random() - 0.5) * 0.5 * f;
            }
            wake();
        }
        function reform() {
            mode = 'reform'; reformT0 = performance.now();
            reformEnd = SPREAD + 260 + 820;
            fadeFrom = parseFloat(getComputedStyle(address).opacity) || 0;
            address.style.transition = 'none';
            for (const c of chips) {
                c.sx = c.x; c.sy = c.y; c.k = 0;
                // Tip first, top to bottom, with a little randomness per chip.
                c.delay = (c.hy - TOP) / (BOTTOM - TOP) * SPREAD + Math.random() * 260;
                c.fly = 560 + Math.random() * 260;
                // Turn the short way home, never a full spin.
                c.sa = Math.atan2(Math.sin(c.a), Math.cos(c.a));
            }
            wake();
        }

        function overLogo(x, y) {
            return x >= ox + 60 * scale && x <= ox + 840 * scale && y >= oy + 110 * scale && y <= oy + 800 * scale;
        }

        canvas.addEventListener('click', e => {
            if (reduceMotion) return;
            if (mode === 'whole') {
                if (!overLogo(e.clientX, e.clientY)) return;
                crumble(e.clientX, e.clientY);
            } else if (mode === 'fallen') {
                // only the address puts the iceberg back together; anywhere else sets off a blast
                if (overAddress(e.clientX, e.clientY)) reform();
                else blast(e.clientX, e.clientY);
            }
        });
        canvas.addEventListener('keydown', e => {
            if (reduceMotion || (e.key !== 'Enter' && e.key !== ' ')) return;
            e.preventDefault();
            if (mode === 'whole') crumble(W / 2, H / 2); else if (mode === 'fallen') reform();
        });
        canvas.addEventListener('pointermove', e => {
            if (e.pointerType !== 'mouse') return;
            canvas.classList.toggle('over-logo', mode !== 'whole' || overLogo(e.clientX, e.clientY));
        });

        window.addEventListener('resize', () => {
            const oldW = W, oldH = H;
            layout();
            if (mode !== 'whole') {
                for (const c of chips) { c.x *= W / oldW; c.y *= H / oldH; }
                wake();
            } else draw();
        });

        layout();
        draw();
        if (document.fonts) document.fonts.ready.then(() => fitAddress(Math.min(W * 0.6, H * 0.6, 480)));
    })();
    </script>
</body>
</html>
